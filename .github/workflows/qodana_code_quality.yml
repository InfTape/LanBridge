name: Qodana Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

concurrency:
  group: qodana-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --project-dir android
          pr-mode: false
          post-pr-comment: false
          push-fixes: none
          upload-result: true
          artifact-name: qodana-android-report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1022648571 }}
          QODANA_ENDPOINT: https://qodana.cloud
