name: Qodana Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

concurrency:
  group: qodana-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Generate Visual Studio solution
        run: cmake -S windows -B windows/build/qodana -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF
      - name: Build Windows application
        run: cmake --build windows/build/qodana --config Release --parallel 2
      - name: Test crypto initialization cleanup
        shell: pwsh
        run: |
          cmake -S windows -B windows/build/crypto-tests -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build windows/build/crypto-tests --config Release --target CryptoInitializationIntegration --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir windows/build/crypto-tests -C Release -R '^CryptoInitializationIntegration$' --output-on-failure
      - name: Place analysis solution at the source root
        shell: pwsh
        run: |
          $solution = Get-Content -LiteralPath windows/build/qodana/LanBridge.sln -Raw
          $solution = [regex]::Replace($solution, '(?m)^(Project\("[^"]+"\) = "[^"]+", ")([^"]+\.vcxproj)(")', '${1}build\qodana\${2}${3}')
          Set-Content -LiteralPath windows/LanBridge.qodana.sln -Value $solution -Encoding utf8
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: >-
            --project-dir windows
            --linter qodana-dotnet
            --within-docker false
            --property=qodana.net.solution=LanBridge.qodana.sln
            --property=qodana.net.platform=x64
            --property=qodana.net.configuration=Release
          pr-mode: false
          post-pr-comment: false
          push-fixes: none
          upload-result: true
          artifact-name: qodana-windows-report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_891294112 }}
          QODANA_ENDPOINT: https://qodana.cloud
